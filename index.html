<!DOCTYPE html>
<html lang="de" data-mode="dark" data-fx="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fehlerbild</title>
<meta name="theme-color" content="#04080e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fehlerbild">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080e;--panel:#0a1420;--panel2:#0f1c2c;--line:#1b3145;--ink:#dcecf6;--muted:#7f99ab;
  --ok:#35e0a1;--warn:#ffb648;--bad:#ff5d62;
  --acc:#3fd8ff;--accink:#03121a;--acc-s:rgba(63,216,255,.12);--acc-l:rgba(63,216,255,.4);--acc-g:rgba(63,216,255,.04);
  --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Chakra Petch","Source Sans 3",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;--fs:16.5px;--dock:64px;color-scheme:dark;
}
html[data-mode=light]{--bg:#e8edf1;--panel:#ffffff;--panel2:#f1f5f8;--line:#c3cfd9;--ink:#0e1c27;--muted:#52677a;--ok:#0c7a50;--warn:#925600;--bad:#bf242b;color-scheme:light}
html[data-big="1"]{--fs:19px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.4 var(--font);min-height:100vh}
html[data-fx=on] body{background:radial-gradient(120% 420px at 50% -80px,var(--acc-s),transparent 70%),linear-gradient(var(--acc-g) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,var(--acc-g) 1px,transparent 1px) 0 0/34px 100%,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
dl{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88em}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.wrap{max-width:540px;margin:0 auto;padding:14px 14px calc(var(--dock) + 36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.wrap[hidden]{display:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:env(safe-area-inset-top,0px)}
.top h1{font:700 26px/1.1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
html[data-fx=on] .top h1{text-shadow:0 0 18px var(--acc-l)}
.ver{font-size:12px;color:var(--muted)}

.bar{display:flex;align-items:center;gap:10px;min-height:46px;padding-top:env(safe-area-inset-top,0px)}
.bar h2{font:700 21px/1.15 var(--disp);letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;overflow-wrap:anywhere}
.backbtn{min-height:44px;padding:0 12px 0 8px;border:1px solid var(--acc-l);background:var(--panel);border-radius:8px;font:600 15px var(--disp);cursor:pointer;white-space:nowrap;color:var(--acc)}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
html[data-fx=on] .card::before,html[data-fx=on] .card::after{content:"";position:absolute;width:13px;height:13px;border:2px solid var(--acc);pointer-events:none;opacity:.85}
html[data-fx=on] .card::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:var(--r) 0 0 0}
html[data-fx=on] .card::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 var(--r) 0}
.lbl,.card h3,.sec{font:600 12.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--acc)}
.sec{margin-top:4px}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{background:none;border:0;padding:6px 0;color:var(--acc);font-weight:600;cursor:pointer;text-align:left}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 16px;border:1px solid var(--acc-l);background:var(--panel2);border-radius:9px;font:600 16px var(--disp);letter-spacing:.02em;cursor:pointer;text-align:center;position:relative;color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accink)}
html[data-fx=on] .btn.primary{box-shadow:0 0 18px var(--acc-s),0 0 2px var(--acc)}
.btn.green{background:var(--ok);border-color:var(--ok);color:#03130c}
html[data-mode=light] .btn.green{color:#fff}
.btn.quiet{border-color:var(--line);background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.armed,.x.armed,.ref button.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{min-height:66px;font-size:19px}
.btn.sm{min-height:44px;padding:6px 12px;font-size:15px}
.btn:active,.tile:active,.mchip:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>*{flex:1 1 130px}
.btn svg,.tile svg,.dock svg,.fico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* HUD */
.hudrow{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none;color:var(--acc)}
.ring.warn{color:var(--warn)}.ring.bad{color:var(--bad)}
.ring svg{width:100%;height:100%;fill:none}
.r-out{stroke:currentColor;stroke-width:1.2;stroke-dasharray:3 9;opacity:.7;transform-origin:60px 60px}
.r-trk{stroke:var(--line);stroke-width:6}
.r-arc{stroke:currentColor;stroke-width:6;stroke-linecap:round}
.r-in{stroke:currentColor;stroke-width:1;opacity:.35;stroke-dasharray:40 12}
html[data-fx=on] .r-out{animation:spin 50s linear infinite}
html[data-fx=on] .r-arc{filter:drop-shadow(0 0 4px currentColor)}
@keyframes spin{to{transform:rotate(360deg)}}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.clock{font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1}
.rs{font-size:11px;color:var(--muted);margin-top:4px}
.hudinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.greet{font:600 19px/1.2 var(--disp)}
.lage{font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--acc-l);border-radius:9px;overflow:hidden}
.seg button{min-height:44px;border:0;border-left:1px solid var(--acc-l);background:transparent;font:600 15px var(--disp);cursor:pointer;padding:4px 6px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.seg button[aria-pressed="true"][class]{background:var(--st);color:#04100c}
html[data-mode=light] .seg button[aria-pressed="true"][class]{color:#fff}
.seg button:focus-visible{outline-offset:-4px}
.seg.wrapseg{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.seg.wrapseg button{border-left:0;border-top:1px solid var(--acc-l)}
.seg.wrapseg button:nth-child(-n+2){border-top:0}
.seg.wrapseg button:nth-child(even){border-left:1px solid var(--acc-l)}
.seg.wrapseg button:last-child:nth-child(odd){grid-column:1/-1}

.st-run{--st:var(--ok)}.st-chk{--st:var(--acc)}.st-mnt{--st:var(--warn)}.st-err,.st-stop{--st:var(--bad)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mchip{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border:1px solid var(--st,var(--line));background:var(--panel);border-radius:999px;cursor:pointer;font:600 15px var(--disp);white-space:nowrap}
.mchip b{font:500 13px var(--mono);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--st,var(--muted));flex:none}
html[data-fx=on] .dot{box-shadow:0 0 8px var(--st)}
html[data-fx=on] .st-err .dot,html[data-fx=on] .st-stop .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.mrow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer;min-height:66px}
.mrow:first-of-type{border-top:0}
.mrow .nm{font-weight:600;overflow-wrap:anywhere}
.ava{width:48px;height:48px;border-radius:50%;border:2px solid var(--st,var(--line));background:var(--bg);display:grid;place-items:center;overflow:hidden;font:700 15px var(--disp);color:var(--muted);flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.lg{width:104px;height:104px;border-width:3px;font-size:30px}
html[data-fx=on] .ava.lg{box-shadow:0 0 22px -4px var(--st)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--st);color:var(--st);border-radius:999px;padding:2px 10px;font:600 13.5px var(--disp);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

.note{border:1px solid var(--warn);border-left-width:5px;border-radius:9px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.note.red{border-color:var(--bad)}.note.acc{border-color:var(--acc)}
.note strong{color:var(--warn)}.note.red strong{color:var(--bad)}.note.acc strong{color:var(--acc)}
.msg{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;text-align:left;cursor:pointer;font-weight:600}
.msg:first-of-type{border-top:0}
.msg i{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.msg span{color:var(--ink);flex:1}
.msg b{color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:92px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.tile svg{color:var(--acc)}
.tile .tl{font:600 14px/1.15 var(--disp);overflow-wrap:anywhere}
.tile .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.tile .cnt{font:500 12px var(--mono);color:var(--muted);text-align:right}
.tile .cnt.hot{color:var(--bad);font-weight:600}.tile .cnt.on{color:var(--ok);font-weight:600}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-weight:600;font-size:.86em;color:var(--muted)}
input:not([type=checkbox]):not([type=range]):not([type=file]):not([type=color]),select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:0}
html[data-mode=light] input:not([type=checkbox]):not([type=range]):not([type=file]):not([type=color]),html[data-mode=light] select,html[data-mode=light] textarea{background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:54px;height:44px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.check{display:flex;gap:12px;align-items:flex-start;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.inline .btn{flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) 40px;gap:6px;align-items:center}
.frow input{min-height:44px;padding:8px 10px}

.photo{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#000}
.photo img{width:100%;max-height:340px;object-fit:contain}
.photo canvas{display:block;width:100%;height:auto;touch-action:none}
.stamp{display:inline-block;font:600 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;border:2px solid currentColor;border-radius:4px;padding:4px 10px;background:rgba(4,8,14,.82)}
.photo .stamp{position:absolute;left:10px;bottom:12px}
.stamp.sure{color:var(--ok)}.stamp.chk{color:var(--warn)}.stamp.unsure,.stamp.none{color:var(--bad)}
html[data-mode=light] .stamp{background:rgba(255,255,255,.9)}
.simbig{font:500 32px/1 var(--mono);color:var(--acc)}
.simline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip b{font:500 .9em var(--mono);margin-left:6px;color:var(--acc)}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

.grow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;min-height:76px;color:var(--ink)}
.grow img{width:60px;height:60px;object-fit:cover;border-radius:7px;background:#000}
.grow .t{font-weight:600;overflow-wrap:anywhere}
.grow .r{font:500 14px var(--mono);text-align:right}
.grow.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.fico{width:60px;height:60px;border-radius:7px;display:grid;place-items:center;background:var(--bg);border:1px solid currentColor}
.tag{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:0 4px;white-space:nowrap}
.tag.b{color:var(--bad);border-color:var(--bad)}.tag.a{color:var(--acc);border-color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--dock) + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accink);padding:8px 14px;z-index:9}
.selbar .in{max-width:540px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selbar .in span{flex:1 1 90px;font-family:var(--mono)}
.selbar .btn{min-height:44px;border-color:var(--accink);background:transparent;color:var(--accink);padding:6px 12px}
.selbar .btn.primary{background:var(--accink);color:var(--acc);box-shadow:none}

.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(84px,34%) 1fr 64px;gap:8px;align-items:center}
.brow .bl{overflow-wrap:anywhere;line-height:1.2}
.brow .bt{height:18px;background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.brow .bf{display:block;height:100%;background:var(--acc);min-width:2px}
.brow .bf.ok{background:var(--ok)}.brow .bf.warn{background:var(--warn)}.brow .bf.bad{background:var(--bad)}
.brow .bv{text-align:right;font-size:.9em}
.prog{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.prog{display:block}.prog i{display:block;height:100%;background:var(--acc)}
.sec.bad{color:var(--bad)}
.mchip b.ok{color:var(--ok)}.mchip b.warn{color:var(--warn)}.mchip b.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.8em;color:var(--muted);font-weight:600;border-top:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{overflow-wrap:anywhere}

.task{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px 4px 4px}
.task label{display:flex;gap:12px;align-items:center;min-height:50px;padding:6px 8px;cursor:pointer;overflow-wrap:anywhere;min-width:0}
.task input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none}
.task.done label .tx{text-decoration:line-through;color:var(--muted)}
.x{min-width:44px;min-height:44px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;border-radius:8px;padding:0 8px}
.card.tc{gap:0}
.tc .ln{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-family:var(--mono)}
.tc .ln:first-child{border-top:0}
.kv{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:6px 12px;align-items:baseline}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.kv.num dd{font-family:var(--mono)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg)}
.kpi b{display:block;font:500 20px var(--mono)}
.kpi span{font-size:.78em;color:var(--muted)}

.refs{display:flex;flex-wrap:wrap;gap:8px}
.ref{position:relative;width:64px;height:64px}
.ref img{width:64px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.ref button{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;border:1px solid var(--acc-l);background:var(--panel);cursor:pointer;font-weight:700;line-height:1;padding:0}
.dcard{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.dcard:first-of-type{border-top:0;padding-top:0}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;min-height:48px;border-top:1px solid var(--line);padding:4px 0}
.wrow:first-of-type{border-top:0}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);background-color:var(--panel);border-top:1px solid var(--acc-l);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports (backdrop-filter:blur(8px)) or (-webkit-backdrop-filter:blur(8px)){.dock{background-color:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}
.dock .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--dock)}
.dock button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 11.5px var(--disp);letter-spacing:.03em;color:var(--muted);cursor:pointer}
.dock button[aria-current="page"]{color:var(--acc)}
html[data-fx=on] .dock button[aria-current="page"] svg{filter:drop-shadow(0 0 5px var(--acc))}

.toast{position:fixed;left:50%;bottom:calc(var(--dock) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;max-width:calc(100% - 32px);text-align:center;z-index:30;font-weight:600}
.toast[hidden]{display:none}
.lock{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center}
.lock[hidden]{display:none}
.lock h2{font:700 28px var(--disp);letter-spacing:.08em;text-transform:uppercase}
html[data-fx=on] .lock h2{text-shadow:0 0 18px var(--acc-l)}
.dots{display:flex;gap:12px;min-height:18px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--acc)}
.dots i.on{background:var(--acc)}

<body>
<main id="app" class="wrap"><div class="top"><h1>Fehlerbild</h1></div><p class="muted">Wird geladen …</p></main>

<script>
'use strict';
const APP_VERSION='2.0.0';
/* ===== PURE-START: reine Funktionen ohne DOM ===== */
const p2=n=>String(n).padStart(2,'0');
const SHIFTS=[{id:'F',name:'Frühschicht',time:'06:00–14:00',xl:'Früh'},{id:'S',name:'Spätschicht',time:'14:00–22:00',xl:'Spät'},{id:'N',name:'Nachtschicht',time:'22:00–06:00',xl:'Nacht'}];
function autoShift(d){const h=d.getHours();return h>=6&&h<14?'F':h>=14&&h<22?'S':'N'}

/* Fingerabdruck aus 48x48 RGBA: Farbmittel 8x8 Blöcke + Helligkeit und Kanten im 12x12-Raster, Länge 1 */
function fingerprint(px){
  const N=48,lum=new Float32Array(N*N);
  for(let i=0;i<N*N;i++)lum[i]=(0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2])/255;
  const col=new Float32Array(192);
  for(let by=0;by<8;by++)for(let bx=0;bx<8;bx++){
    let r=0,g=0,b=0;
    for(let y=0;y<6;y++)for(let x=0;x<6;x++){const i=((by*6+y)*N+bx*6+x)*4;r+=px[i];g+=px[i+1];b+=px[i+2]}
    const k=(by*8+bx)*3;col[k]=r/9180;col[k+1]=g/9180;col[k+2]=b/9180;
  }
  const bri=new Float32Array(144),edg=new Float32Array(144);
  for(let cy=0;cy<12;cy++)for(let cx=0;cx<12;cx++){
    let s=0,e=0;
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){
      const X=cx*4+x,Y=cy*4+y,v=lum[Y*N+X];
      s+=v;e+=Math.abs(lum[Y*N+Math.min(N-1,X+1)]-v)+Math.abs(lum[Math.min(N-1,Y+1)*N+X]-v);
    }
    bri[cy*12+cx]=s/16;edg[cy*12+cx]=e/16;
  }
  const out=new Float32Array(480);
  const place=(src,off,w,step)=>{
    for(let c=0;c<step;c++){let m=0,n=0;for(let i=c;i<src.length;i+=step){m+=src[i];n++}m/=n;for(let i=c;i<src.length;i+=step)src[i]-=m}
    let q=0;for(let i=0;i<src.length;i++)q+=src[i]*src[i];q=Math.sqrt(q);
    if(q>1e-6)for(let i=0;i<src.length;i++)out[off+i]=src[i]/q*w;
  };
  place(col,0,Math.sqrt(.4),3);place(bri,192,Math.sqrt(.3),1);place(edg,336,Math.sqrt(.3),1);
  let q=0;for(let i=0;i<480;i++)q+=out[i]*out[i];q=Math.sqrt(q);
  if(q>1e-6)for(let i=0;i<480;i++)out[i]/=q;
  return out;
}
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s}
function pct(sim){return Math.max(0,Math.min(100,Math.round(sim*100)))}
function verdict(sim){return sim==null?'none':sim>=.86?'sure':sim>=.74?'chk':'unsure'}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
/* ZIP ohne Kompression (Fotos sind schon komprimiert) */
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),d=f.date||new Date();
    const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,f.data.length,true);lh.setUint32(22,f.data.length,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,f.data.length,true);ch.setUint32(24,f.data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+f.data.length;
  }
  const cd=central.reduce((a,p)=>a+p.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cd,true);end.setUint32(16,off,true);
  return [...parts,...central,new Uint8Array(end.buffer)];
}
function csvCell(v){v=String(v==null?'':v);return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')+'\r\n'}
function mondayStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime()}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
/* gearbeitete Zeit aus Kommen/Gehen-Stempeln im Fenster [from,to] */
function workedMs(stamps,from,to){
  let ms=0,open=null;
  for(const s of stamps.slice().sort((a,b)=>a.ts-b.ts)){
    if(s.type==='in'){if(open===null)open=s.ts}
    else if(open!==null){ms+=Math.max(0,Math.min(s.ts,to)-Math.max(open,from));open=null}
  }
  if(open!==null)ms+=Math.max(0,to-Math.max(open,from));
  return ms;
}
function fmtDur(ms){const m=Math.floor(ms/6e4);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function safeName(s){return String(s).trim().replace(/[^A-Za-z0-9äöüÄÖÜß-]+/g,'_').replace(/^_+|_+$/g,'')||'x'}
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const dayTs=k=>{const a=String(k).split('-');return new Date(+a[0],+a[1]-1,+a[2]).getTime()};
const fmtDay=k=>{const a=String(k).split('-');return a[2]+'.'+a[1]+'.'+a[0]};
const addDays=(k,n)=>{const d=new Date(dayTs(k));d.setDate(d.getDate()+n);return dayKey(d.getTime())};
const dayDiff=(a,b)=>Math.round((dayTs(a)-dayTs(b))/864e5);
const xlDay=n=>{const d=new Date(Math.round((n-25569)*864e5));return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())};
const fmtQ=q=>q==null?'–':(q*100).toFixed(1).replace('.',',')+' %';
const cut=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
function cmpVer(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0}
function hexRgb(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');const n=parseInt(m?m[1]:'3fd8ff',16);return[n>>16&255,n>>8&255,n&255]}
function relLum(r,g,b){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)}
/* Akzentfarbe so anpassen, dass sie auf dunklem bzw. hellem Grund lesbar bleibt */
function tuneAccent(hex,light){
  let [r,g,b]=hexRgb(hex);
  if(light){let k=1;while(relLum(r*k,g*k,b*k)>.16&&k>.2)k-=.04;r=Math.round(r*k);g=Math.round(g*k);b=Math.round(b*k)}
  else{let k=0;while(relLum(r+(255-r)*k,g+(255-g)*k,b+(255-b)*k)<.3&&k<.9)k+=.04;r=Math.round(r+(255-r)*k);g=Math.round(g+(255-g)*k);b=Math.round(b+(255-b)*k)}
  return[r,g,b];
}
/* Zustand einer Checkliste: Schlüssel des laufenden Zeitraums */
function periodKey(period,d){
  if(period==='tag')return dayKey(d.getTime());
  if(period==='woche'){const m=new Date(mondayStart(d));return dayKey(m.getTime())+'W'}
  if(period==='monat')return d.getFullYear()+'-'+p2(d.getMonth()+1);
  if(period==='schicht'){const s=autoShift(d),x=new Date(d.getTime());if(s==='N'&&d.getHours()<6)x.setDate(x.getDate()-1);return dayKey(x.getTime())+s}
  return '';
}
/* ===== PURE-END ===== */

const DEFECTS=['Kratzer','Delle','Riss','Verfärbung','Grat','Verschmutzung','Maßabweichung','Fehlstelle'];
const STATUS={laeuft:{name:'Läuft',cls:'st-run'},pruefung:{name:'In Prüfung',cls:'st-chk'},wartung:{name:'Wartung',cls:'st-mnt'},stoerung:{name:'Störung',cls:'st-err'},stillstand:{name:'Stillstand',cls:'st-stop'}};
const PRIO={h:'Hoch',m:'Mittel',n:'Niedrig'};
const PERIOD={schicht:'Jede Schicht',tag:'Täglich',woche:'Wöchentlich',monat:'Monatlich',frei:'Ohne Automatik'};
const UNIT={d:'Tage',w:'Wochen',m:'Monate'};
const TPL_M=['Hersteller / Integrator','Prüfaufgabe / Bauteil','Software + Version','Kamera / Objektiv','Beleuchtung','Trigger / SPS','Rezept-Pfad','Backup (Ort, Datum)','Ansprechpartner','Besonderheiten'];
const TPL_P=['Art.-Nr. / Bauteilnummer','Werkstoff / Legierung','Prüfaufgabe','Besonderheiten'];
const ACCENTS=[['#3fd8ff','Cyan'],['#4f8dff','Blau'],['#35e0a1','Grün'],['#ffb648','Bernstein'],['#ff6b4a','Rot'],['#b98cff','Violett'],['#f2f5f7','Weiß']];
const needsAttention=m=>m.status==='stoerung'||m.status==='stillstand';

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtDate=ts=>new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const startOfDay=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const today=()=>dayKey(Date.now());
const fmtSince=ts=>ts>=startOfDay()?fmtTime(ts)+' Uhr':new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' '+fmtTime(ts)+' Uhr';
const stampName=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+'-'+p2(d.getMinutes())+'-'+p2(d.getSeconds())};
const localInput=ts=>{const d=new Date(ts);return dayKey(ts)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const shiftName=id=>(SHIFTS.find(s=>s.id===id)||{name:'–'}).name;
const ICON={
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  grid:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
  bars:'<path d="M4 20h16M7 20v-8M12 20V5M17 20v-5"/>',
  list:'<path d="M4 7l2 2 3-4M4 16l2 2 3-4M13 7h7M13 16h7"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
  set:'<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/>',
  fab:'<path d="M3 20h18M5 20V10l5 3v-3l5 3V5h4v15"/>',
  home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v5M12 17.4v.2"/>',
  wrench:'<path d="M20 7a4.5 4.5 0 0 1-6 4.2L7 18.5 5.5 17l7.3-7A4.5 4.5 0 0 1 17 4l-2.5 2.5 3 3z"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/>',
  doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
  box:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
  num:'<path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/>',
  cmp:'<rect x="3" y="6" width="8" height="12"/><rect x="13" y="6" width="8" height="12"/><path d="M15 14l2-2.5 2 1.5"/>',
  xls:'<path d="M4 5h16v14H4z"/><path d="M4 10h16M4 15h16M10 5v14"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'
};
const ico=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';

/* ===== Speicher: IndexedDB, bei Verweigerung nur Arbeitsspeicher ===== */
const STORES=['kv','products','defects','refs','checks','images','tasks','stamps','machines','faults','maint','lists','counts'];
const LISTS=['products','defects','refs','checks','tasks','stamps','machines','faults','maint','lists','counts'];
const Store={
  db:null,mem:null,
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('fehlerbild',2);
        r.onupgradeneeded=()=>{const d=r.result;for(const s of STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
        setTimeout(()=>rej(new Error('timeout')),6000);
      });
      this.db.onversionchange=()=>{try{this.db.close()}catch(e){}};
    }catch(e){this.db=null;this.mem={};for(const s of STORES)this.mem[s]=new Map()}
  },
  tx(store,mode,fn){
    return new Promise((res,rej)=>{
      const t=this.db.transaction(store,mode),rq=fn(t.objectStore(store));let out;
      if(rq)rq.onsuccess=()=>{out=rq.result};
      t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'));
    });
  },
  all(s){return this.db?this.tx(s,'readonly',o=>o.getAll()):Promise.resolve([...this.mem[s].values()])},
  get(s,id){return this.db?this.tx(s,'readonly',o=>o.get(id)):Promise.resolve(this.mem[s].get(id))},
  put(s,v){return this.db?this.tx(s,'readwrite',o=>{o.put(v)}):Promise.resolve(void this.mem[s].set(v.id,v))},
  putMany(s,arr){if(!arr.length)return Promise.resolve();return this.db?this.tx(s,'readwrite',o=>{for(const v of arr)o.put(v)}):Promise.resolve(void arr.forEach(v=>this.mem[s].set(v.id,v)))},
  del(s,id){return this.db?this.tx(s,'readwrite',o=>{o.delete(id)}):Promise.resolve(void this.mem[s].delete(id))},
  clear(s){return this.db?this.tx(s,'readwrite',o=>{o.clear()}):Promise.resolve(void this.mem[s].clear())}
};
async function save(store,obj){
  try{await Store.put(store,obj)}
  catch(e){toast('Speichern fehlgeschlagen. Ist der Speicher des Geräts voll?');throw e}
}

const S={kv:{},products:[],defects:[],refs:[],checks:[],tasks:[],stamps:[],machines:[],faults:[],maint:[],lists:[],counts:[]};
async function setKv(k,v){S.kv[k]=v;await save('kv',{id:k,value:v})}
const prod=id=>S.products.find(p=>p.id===id);
const def=id=>S.defects.find(d=>d.id===id);
const mach=id=>S.machines.find(m=>m.id===id);
const defsOf=pid=>S.defects.filter(d=>d.productId===pid);
const refsOf=did=>S.refs.filter(r=>r.defectId===did);
const label=(pid,did)=>((prod(pid)||{}).name||'?')+' · '+((def(did)||{}).name||'?');
const mname=id=>(mach(id)||{}).name||'';
const tpl=k=>(S.kv[k]||(k==='tplM'?TPL_M:TPL_P)).map(x=>({k:x,v:''}));

async function loadAll(){
  for(const s of LISTS)S[s]=await Store.all(s);
  S.kv={};(await Store.all('kv')).forEach(r=>{S.kv[r.id]=r.value});
  S.products.sort((a,b)=>a.pos-b.pos);S.defects.sort((a,b)=>a.pos-b.pos);S.checks.sort((a,b)=>b.ts-a.ts);S.stamps.sort((a,b)=>a.ts-b.ts);S.refs.sort((a,b)=>a.ts-b.ts);
  for(const m of S.machines)if(!m.fields)m.fields=[];
  for(const p of S.products){if(!p.fields)p.fields=[];if(!p.machines)p.machines=[]}
}
async function addProduct(name){
  const p={id:uid(),name,pos:Date.now()+S.products.length,fields:tpl('tplP'),machines:[],image:''};
  S.products.push(p);await save('products',p);
  for(let i=0;i<DEFECTS.length;i++){const d={id:uid(),productId:p.id,name:DEFECTS[i],pos:i};S.defects.push(d);await save('defects',d)}
  return p;
}
async function seed(){
  for(let i=1;i<=4;i++)await addProduct('Produkt '+i);
  await setKv('seeded',true);
}
async function delChecks(fn){
  const gone=S.checks.filter(fn);S.checks=S.checks.filter(c=>!fn(c));
  for(const c of gone){await Store.del('checks',c.id);await Store.del('images',c.id)}
}
async function delRefs(fn){
  const gone=S.refs.filter(fn);S.refs=S.refs.filter(r=>!fn(r));
  for(const r of gone)await Store.del('refs',r.id);
}
async function delDefect(id){
  await delRefs(r=>r.defectId===id);await delChecks(c=>c.defectId===id);
  S.defects=S.defects.filter(d=>d.id!==id);await Store.del('defects',id);
}
async function delProduct(id){
  for(const d of defsOf(id))await delDefect(d.id);
  S.products=S.products.filter(p=>p.id!==id);await Store.del('products',id);
}
async function addRef(productId,defectId,vec,thumb){
  const r={id:uid(),productId,defectId,vec:Array.from(vec),thumb,ts:Date.now()};
  S.refs.push(r);await save('refs',r);return r;
}

/* ===== Aussehen ===== */
const cfg=()=>Object.assign({mode:'dark',accent:'#3fd8ff',fx:true,big:false,title:'Fehlerbild',user:''},S.kv.ui||{});
function applyTheme(){
  const c=cfg(),el=document.documentElement,light=c.mode==='light',[r,g,b]=tuneAccent(c.accent,light),st=el.style;
  el.dataset.mode=light?'light':'dark';el.dataset.fx=c.fx?'on':'off';el.dataset.big=c.big?'1':'0';
  st.setProperty('--acc','rgb('+r+','+g+','+b+')');
  st.setProperty('--accink',relLum(r,g,b)>.3?'#03121a':'#ffffff');
  st.setProperty('--acc-s','rgba('+r+','+g+','+b+','+(light?.1:.13)+')');
  st.setProperty('--acc-l','rgba('+r+','+g+','+b+','+(light?.5:.42)+')');
  st.setProperty('--acc-g','rgba('+r+','+g+','+b+','+(light?.06:.04)+')');
  const m=$('meta[name=theme-color]');if(m)m.content=light?'#e8edf1':'#04080e';

}

function shiftProg(){const d=new Date(),h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;return Math.min(1,Math.max(0,(h>=6&&h<14?h-6:h>=14&&h<22?h-14:h>=22?h-22:h+2)/8))}

function kpi(fn,from,to){let c=0,n=0,p=0;for(const x of S.counts)if(x.date>=from&&x.date<=to&&(!fn||fn(x))){c+=+x.checked||0;n+=+x.nio||0;p+=+x.pseudo||0}return{c,n,p,q:c>0?n/c:null,qe:c>0?Math.max(n-p,0)/c:null}}

function rollLists(){

/* ===== Bilder ===== */
function loadImage(src){
  return new Promise((res,rej)=>{
    const url=typeof src==='string'?src:URL.createObjectURL(src),im=new Image();
    const done=()=>{if(typeof src!=='string')URL.revokeObjectURL(url)};
    im.onload=()=>{res({im,done})};
    im.onerror=()=>{done();rej(new Error('Bild konnte nicht gelesen werden'))};
    im.src=url;
  });
}
function draw(im,w,h,sx,sy,sw,sh){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,w,h);
  x.drawImage(im,sx,sy,sw,sh,0,0,w,h);return c;
}
async function analyse(src){
  const {im,done}=await loadImage(src);
  try{
    const W=im.naturalWidth,H=im.naturalHeight;
    const vec=fingerprint(draw(im,48,48,0,0,W,H).getContext('2d').getImageData(0,0,48,48).data);
    const k=Math.min(1,480/Math.max(W,H));
    const thumb=draw(im,Math.max(1,Math.round(W*k)),Math.max(1,Math.round(H*k)),0,0,W,H).toDataURL('image/jpeg',.72);
    return {vec,thumb};
  }finally{done()}
}
async function squareImage(file,size){
  const {im,done}=await loadImage(file);
  try{const W=im.naturalWidth,H=im.naturalHeight,s=Math.min(W,H);return draw(im,size,size,(W-s)/2,(H-s)/2,s,s).toDataURL('image/jpeg',.8)}
  finally{done()}
}
async function smallImage(file,max){
  const {im,done}=await loadImage(file);
  try{const W=im.naturalWidth,H=im.naturalHeight,k=Math.min(1,max/Math.max(W,H));return draw(im,Math.max(1,Math.round(W*k)),Math.max(1,Math.round(H*k)),0,0,W,H).toDataURL('image/jpeg',.75)}
  finally{done()}
}
function dataUrlBytes(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function bufToB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64ToBuf(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
function matches(vec){
  const best=new Map();
  for(const r of S.refs){const s=dot(vec,r.vec),b=best.get(r.defectId);if(!b||s>b.sim)best.set(r.defectId,{productId:r.productId,defectId:r.defectId,sim:s})}
  return [...best.values()].sort((a,b)=>b.sim-a.sim);
}

/* ----- Bildvergleich (Pixelunterschiede zweier Fotos, mit Markierungen) ----- */
const CMP={ref:null,test:null,base:null,pct:null,boxes:[],prod:'',def:'',verdict:'NIO',note:'',sens:35,over:true};
const CW=900,CH=600;
function fitCanvas(im){const c=document.createElement('canvas');c.width=CW;c.height=CH;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#000';x.fillRect(0,0,CW,CH);const k=Math.min(CW/im.naturalWidth,CH/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;x.drawImage(im,(CW-w)/2,(CH-h)/2,w,h);return x.getImageData(0,0,CW,CH)}
function cmpCompute(){
  const a=fitCanvas(CMP.ref),b=fitCanvas(CMP.test),th=CMP.sens*2.55,A=a.data,B=b.data;let n=0;
  for(let i=0;i<A.length;i+=4){
    const d=(Math.abs(A[i]-B[i])+Math.abs(A[i+1]-B[i+1])+Math.abs(A[i+2]-B[i+2]))/3;
    if(d>th){n++;if(CMP.over){B[i]=255;B[i+1]=60;B[i+2]=70}}
  }
  CMP.base=b;CMP.pct=n/(CW*CH)*100;
}
function cmpDraw(prev){
  const cv=$('#cmpc');if(!cv||!CMP.base)return;
  const x=cv.getContext('2d');x.putImageData(CMP.base,0,0);
  const col=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#3fd8ff';
  CMP.boxes.forEach((b,i)=>{x.strokeStyle=col;x.lineWidth=4;x.strokeRect(b.x*CW,b.y*CH,b.w*CW,b.h*CH);x.font='bold 20px system-ui,sans-serif';const t=(i+1)+'. '+b.label,tw=x.measureText(t).width,ty=Math.max(26,b.y*CH-6);x.fillStyle='rgba(0,0,0,.72)';x.fillRect(b.x*CW,ty-21,tw+10,26);x.fillStyle=col;x.fillText(t,b.x*CW+5,ty-2)});
  if(prev){x.strokeStyle='#fff';x.setLineDash([9,6]);x.lineWidth=3;x.strokeRect(prev.x,prev.y,prev.w,prev.h);x.setLineDash([])}
}

    ${fld('Notiz',`<textarea id="c-note" data-inp="cmpnote" placeholder="optional">${esc(CMP.note)}</textarea>`)}

    <button class="btn quiet" data-act="cmpreset" data-confirm="Wirklich verwerfen?">Neuer Vergleich</button>
  </section>`:''}`;
};
AFTER.vergleich=()=>{
  const cv=$('#cmpc');if(!cv)return;cmpDraw();
  let st=null;const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*CW,y:(e.clientY-r.top)/r.height*CH}};
  cv.addEventListener('pointerdown',e=>{st=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(x){}});
  cv.addEventListener('pointermove',e=>{if(!st)return;const p=pos(e);cmpDraw({x:st.x,y:st.y,w:p.x-st.x,h:p.y-st.y})});
  const end=e=>{if(!st)return;const p=pos(e),s=st;st=null;
    if(Math.abs(p.x-s.x)>12&&Math.abs(p.y-s.y)>12){CMP.boxes.push({x:Math.min(s.x,p.x)/CW,y:Math.min(s.y,p.y)/CH,w:Math.abs(p.x-s.x)/CW,h:Math.abs(p.y-s.y)/CH,label:(def(CMP.def)||{}).name||'Markierung'});render()}else cmpDraw()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',()=>{st=null;cmpDraw()});
};

/* ----- Auswertung ----- */
const PERIODS=[['heute','Heute'],['7','7 Tage'],['30','30 Tage'],['alle','Alles']];
function statFrom(){const p=V.period||'7';return p==='heute'?today():p==='alle'?'0000-00-00':addDays(today(),-(Number(p)-1))}
function statList(){const f=statFrom(),from=f<'1'?0:dayTs(f);return filtered().filter(c=>c.ts>=from)}
VIEWS.auswertung=()=>{
  const p=V.period||'7',list=statList(),cnt=new Map(),from=statFrom(),t=today();
  for(const c of list){const n=(def(c.defectId)||{}).name||'?';cnt.set(n,(cnt.get(n)||0)+1)}
  const rows=[...cnt.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'de')),max=rows.length?rows[0][1]:1;
  const pf=x=>(!V.fp||x.productId===V.fp)&&(!V.fs||x.shift===V.fs);
  const mk=byName().map(m=>({m,k:kpi(x=>x.machineId===m.id&&pf(x),from,t)})).filter(x=>x.k.c>0),tot=kpi(pf,from,t);
  const sh=SHIFTS.map(s=>({s,k:kpi(x=>x.shift===s.id&&(!V.fp||x.productId===V.fp),from,t)})).filter(x=>x.k.c>0);
  const mo=dayKey(mondayStart(new Date())),wk=[];
  for(let i=7;i>=0;i--){const a=addDays(mo,-7*i),k=kpi(pf,a,addDays(a,6));wk.push({a,k})}
  const wmax=Math.max(.0001,...wk.map(w=>w.k.q||0));
  return bar('Auswertung')+`
  <div class="seg" role="group" aria-label="Zeitraum">${PERIODS.map(([k,n])=>`<button data-act="period" data-id="${k}" aria-pressed="${k===p}">${n}</button>`).join('')}</div>
  ${filterHtml()}
  <section class="card"><div class="rowhead"><h3>NIO-Quote je Anlage</h3><span class="mono small">${tot.c} geprüft</span></div>
    ${mk.length?`<table><thead><tr><th>Anlage</th><th class="n">Geprüft</th><th class="n">NIO</th><th class="n">Quote</th><th class="n">Echt</th></tr></thead><tbody>
      ${mk.map(({m,k})=>`<tr><td>${esc(m.name)}</td><td class="n">${k.c}</td><td class="n">${k.n}</td><td class="n ${qClass(m,k.q)}">${fmtQ(k.q)}</td><td class="n">${fmtQ(k.qe)}</td></tr>`).join('')}
      <tr><td><strong>Gesamt</strong></td><td class="n">${tot.c}</td><td class="n">${tot.n}</td><td class="n">${fmtQ(tot.q)}</td><td class="n">${fmtQ(tot.qe)}</td></tr></tbody></table>
      <p class="muted small">„Echt“ ist die Quote ohne Pseudofehler.</p>`
      :'<p class="muted">Keine Stückzahlen in dieser Auswahl.</p>'}
  </section>
  ${sh.length?`<section class="card"><h3>Schichtvergleich</h3><div class="bars">${sh.map(({s,k})=>`<div class="brow"><span class="bl">${s.xl}</span><span class="bt"><span class="bf" style="width:${(k.q/Math.max(...sh.map(x=>x.k.q),.0001)*100).toFixed(1)}%"></span></span><span class="bv mono">${fmtQ(k.q)}</span></div>`).join('')}</div></section>`:''}
  ${wk.some(w=>w.k.c>0)?`<section class="card"><h3>Verlauf · 8 Wochen</h3><div class="bars">${wk.map(w=>`<div class="brow"><span class="bl mono small">KW ${isoWeek(new Date(dayTs(w.a)))}</span><span class="bt"><span class="bf" style="width:${((w.k.q||0)/wmax*100).toFixed(1)}%"></span></span><span class="bv mono">${fmtQ(w.k.q)}</span></div>`).join('')}</div></section>`:''}
  <section class="card"><div class="rowhead"><h3>Häufigste Fehler (Fotos)</h3><span class="mono small">${list.length} ${list.length===1?'Foto':'Fotos'}</span></div>
    ${rows.length?'<div class="bars">'+rows.slice(0,8).map(([n,v])=>`<div class="brow"><span class="bl">${esc(n)}</span><span class="bt"><span class="bf" style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="bv mono">${v} · ${Math.round(v/list.length*100)} %</span></div>`).join('')+'</div>'
      :'<p class="muted">Keine Fotos in dieser Auswahl.</p>'}
  </section>
  ${rows.length?'<button class="btn" data-act="csvstats">Diese Fotos als CSV exportieren</button>':''}`;
};

    ${fld('Ursache',txa('f','cause',f.cause,'Woran lag es?'))}
    ${fld('Lösung',txa('f','fix',f.fix,'Was hat geholfen? Das findest du später über die Suche wieder.'))}

ACT.savefault=async()=>{
  const d=V.f,title=d.title.trim();if(!title){toast('Bitte kurz beschreiben, was passiert ist.');return}
  let f=d.id&&S.faults.find(x=>x.id===d.id);
  if(!f){f={id:uid()};S.faults.push(f)}
  const was=f.status;
  Object.assign(f,{ts:d.ts,machineId:d.machineId,productId:d.productId,shift:d.shift,title,desc:d.desc.trim(),cause:d.cause.trim(),fix:d.fix.trim(),dur:numOrEmpty(d.dur),tags:d.tags.trim(),status:d.status,thumb:d.thumb});
  if(f.status==='behoben'&&was!=='behoben')f.closedAt=Date.now();if(f.status==='offen')f.closedAt=null;
  await save('faults',f);
  const m=mach(f.machineId);
  if(m&&d.sync){
    const to=f.status==='offen'?(needsAttention(m)?null:'stoerung'):(m.status==='stoerung'&&!S.faults.some(x=>x.machineId===m.id&&x.status==='offen')?'laeuft':null);
    if(to){m.status=to;m.statusAt=Date.now();await save('machines',m)}
  }
  toast('Störung gespeichert.');back();
};

ACT.savemaint=async()=>{
  const d=V.w,title=d.title.trim();if(!title){toast('Bitte eintragen, was zu tun ist.');return}if(!d.due){toast('Bitte ein Datum wählen.');return}

ACT.savecount=async()=>{
  const d=V.c,ch=parseInt(d.checked,10),nio=parseInt(d.nio,10)||0,ps=parseInt(d.pseudo,10)||0;
  if(!d.machineId||!d.date){toast('Bitte Datum und Anlage wählen.');return}
  if(!(ch>0)){toast('Bitte die Zahl der geprüften Teile eintragen.');return}
  if(nio>ch||ps>nio){toast('NIO darf nicht größer als Geprüft sein, Pseudo nicht größer als NIO.');return}
  const nw={date:d.date,machineId:d.machineId,productId:d.productId,shift:d.shift,checked:ch,nio,pseudo:ps,src:'app',exp:null};
  let c=S.counts.find(x=>countKey(x)===countKey(nw));const upd=!!c;
  if(c)Object.assign(c,nw);else{c=Object.assign({id:uid()},nw);S.counts.push(c)}
  await save('counts',c);d.checked='';d.nio='';d.pseudo='';toast(upd?'Eintrag aktualisiert.':'Gespeichert.');render();
};
ACT.delcount=async el=>{S.counts=S.counts.filter(c=>c.id!==el.dataset.id);await Store.del('counts',el.dataset.id);render()};
ACT.csvcounts=async el=>{
  const all=el.dataset.all==='1',l=S.counts.filter(c=>all||!c.exp).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  if(!l.length){toast(all?'Es gibt noch keine Stückzahlen.':'Keine neuen Einträge seit dem letzten Export.');return}
  const rows=[['Datum','Anlage','Schicht','Geprüft','NIO','Pseudo','Produkt']].concat(l.map(c=>[fmtDay(c.date),mname(c.machineId),(SHIFTS.find(s=>s.id===c.shift)||{xl:''}).xl,c.checked,c.nio,c.pseudo||0,(prod(c.productId)||{}).name||'']));
  await saveFile('cockpit_tagesdaten_'+stampName(Date.now())+'.csv',toCsv(rows),'text/csv');
  const now=Date.now();for(const c of l)c.exp=now;await Store.putMany('counts',l);render();
};

function reportFaults(l){
  if(!l.length)return '<p class="empty">Keine Störungen.</p>';
  return '<table><thead><tr><th>Wann</th><th>Anlage</th><th>Störung, Ursache, Lösung</th><th>Status</th></tr></thead><tbody>'+l.map(f=>`<tr><td>${fmtDate(f.ts).slice(0,6)} ${fmtTime(f.ts)}</td><td>${esc(mname(f.machineId)||'–')}</td><td><strong>${esc(f.title)}</strong>${f.desc?'<br>'+esc(f.desc):''}${f.cause?'<br>Ursache: '+esc(f.cause):''}${f.fix?'<br>Lösung: '+esc(f.fix):''}${hasNum(f.dur)?'<br>Dauer: '+f.dur+' min':''}</td><td class="${f.status==='offen'?'bad':'ok'}">${f.status==='offen'?'Offen':'Behoben'}</td></tr>`).join('')+'</tbody></table>';

  return{title:title+' '+(week?'KW '+isoWeek(new Date(t0)):fmtDay(from)),html:h.join(''),text:tx.join('\n')};

async function unzipReader(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true),files=new Map();let p=dv.getUint32(e+16,true);
  for(let i=0;i<n&&dv.getUint32(p,true)===0x02014b50;i++){
    const nl=dv.getUint16(p+28,true);
    files.set(dec.decode(u8.subarray(p+46,p+46+nl)),{method:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)});
    p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true);
  }
  return async name=>{
    const f=files.get(name);if(!f)return null;
    const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),raw=u8.subarray(s,s+f.cs);
    if(f.method===0)return dec.decode(raw);
    if(typeof DecompressionStream==='undefined')throw new Error('old');
    return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
}
async function readXlsx(buf){
  const read=await unzipReader(buf),xml=async n=>{const t=await read(n);return t?new DOMParser().parseFromString(t,'application/xml'):null};
  const els=(d,t)=>Array.from(d.getElementsByTagNameNS('*',t));
  const wb=await xml('xl/workbook.xml'),rels=await xml('xl/_rels/workbook.xml.rels');if(!wb||!rels)throw new Error('xlsx');
  const tg={};els(rels,'Relationship').forEach(r=>{tg[r.getAttribute('Id')]=r.getAttribute('Target')});
  const sst=await xml('xl/sharedStrings.xml'),strs=sst?els(sst,'si').map(si=>els(si,'t').filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')):[];
  const sheets={};
  els(wb,'sheet').forEach(s=>{let t=tg[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id')]||'';sheets[s.getAttribute('name')]=t.charAt(0)==='/'?t.slice(1):'xl/'+t});
  return{names:Object.keys(sheets),async sheet(name){
    const d=sheets[name]&&await xml(sheets[name]);if(!d)return null;const cells=new Map();
    for(const c of els(d,'c')){
      const t=c.getAttribute('t');let v=null;
      for(const k of c.children)if(k.localName==='v'){v=k.textContent;break}
      let val;
      if(t==='inlineStr')val=els(c,'t').map(x=>x.textContent).join('');
      else if(v==null)continue;
      else if(t==='s')val=strs[+v];else if(t==='str')val=v;else if(t==='e')val='';else if(t==='b')val=v==='1';else val=Number(v);
      cells.set(c.getAttribute('r'),val);
    }
    return a=>{const v=cells.get(a);return v==null?'':v};
  }};
}
function setField(fields,k,v){const f=fields.find(x=>x.k.trim().toLowerCase()===k.toLowerCase());if(f){if(v)f.v=v}else fields.push({k,v})}
async function importCockpit(buf){
  const x=await readXlsx(buf);
  if(!['Anlagen','Produkte','Tagesdaten'].every(n=>x.names.includes(n)))throw new Error('nocockpit');
  const res={mNew:0,mUpd:0,pNew:0,pUpd:0,cNew:0,cUpd:0,tNew:0},str=v=>String(v==null?'':v).trim(),col=(c,n)=>String.fromCharCode(c.charCodeAt(0)+n);
  const find=(list,n)=>list.find(o=>o.name.trim().toLowerCase()===n.toLowerCase());
  const getMachine=async name=>{let m=find(S.machines,name);if(!m){m={id:uid(),name,place:'',status:'laeuft',statusAt:Date.now(),created:Date.now(),note:'',image:'',ziel:'',rot:'',fields:[]};S.machines.push(m);await save('machines',m);res.mNew++}return m};
  const A=await x.sheet('Anlagen');
  for(let i=0;i<9;i++){
    const c='BGL'[i%3],vc=col(c,2),r0=4+30*Math.floor(i/3),name=str(A(c+r0));if(!name)continue;
    const had=!!find(S.machines,name),m=await getMachine(name);if(had)res.mUpd++;
    for(let r=r0+13;r<=r0+23;r++){const k=str(A(c+r)),v=str(A(vc+r));if(!k)continue;if(/^standort/i.test(k)){if(v)m.place=v}else setField(m.fields,k,v)}
    const z=A(vc+(r0+24)),ro=A(vc+(r0+25));if(typeof z==='number')m.ziel=+(z*100).toFixed(2);if(typeof ro==='number')m.rot=+(ro*100).toFixed(2);
    await save('machines',m);
  }
  const P=await x.sheet('Produkte');
  for(let i=0;i<12;i++){
    const c='BGL'[i%3],vc=col(c,2),r0=4+27*Math.floor(i/3),name=str(P(c+r0));if(!name)continue;
    let p=find(S.products,name);if(p)res.pUpd++;else{p=await addProduct(name);res.pNew++}
    for(let r=r0+12;r<=r0+15;r++){const k=str(P(c+r)),v=str(P(vc+r));if(k)setField(p.fields,k,v)}
    let n=0;for(let r=r0+17;r<=r0+22;r++){const v=[0,1,2,3].map(d=>str(P(col(c,d)+r))).filter(Boolean).join(' · ');if(v)setField(p.fields,'Prüfmerkmal '+(++n),v)}
    for(let r=r0+24;r<=r0+25;r++)for(const cc of [c,vc]){const an=str(P(cc+r));if(an){const m=find(S.machines,an);if(m&&!p.machines.includes(m.id))p.machines.push(m.id)}}
    await save('products',p);
  }
  const T=await x.sheet('Tagesdaten'),idx=new Map(S.counts.map(c=>[countKey(c),c])),chg=[];
  for(let r=5;r<=3004;r++){
    const d=T('B'+r),an=str(T('C'+r)),ch=T('F'+r);
    if(typeof d!=='number'||!an||typeof ch!=='number'||ch<=0||str(T('L'+r))==='Demo')continue;
    const m=await getMachine(an),pn=str(T('D'+r)),p=pn?find(S.products,pn):null,sx=str(T('E'+r)).charAt(0).toUpperCase(),
      nw={date:xlDay(d),machineId:m.id,productId:p?p.id:'',shift:sx==='S'?'S':sx==='N'?'N':'F',checked:Math.round(ch),nio:Math.round(+T('G'+r)||0),pseudo:Math.round(+T('H'+r)||0)};
    const old=idx.get(countKey(nw));
    if(old){if(old.checked!==nw.checked||old.nio!==nw.nio||old.pseudo!==nw.pseudo){Object.assign(old,nw,{src:'excel',exp:Date.now()});chg.push(old);res.cUpd++}}
    else{const c=Object.assign({id:uid(),src:'excel',exp:Date.now()},nw);S.counts.push(c);idx.set(countKey(c),c);chg.push(c);res.cNew++}
  }
  await Store.putMany('counts',chg);
  const U=x.names.includes('Aufgaben')?await x.sheet('Aufgaben'):null,nt=[];
  if(U)for(let r=25;r<=124;r++){
    const text=str(U('B'+r)),st=str(U('J'+r));if(!text||st==='Demo'||/^(DEMO|BEISPIEL):/i.test(text))continue;
    if(S.tasks.some(t=>t.text.trim().toLowerCase()===text.toLowerCase()))continue;
    const pr=str(U('H'+r)).charAt(0).toLowerCase(),du=U('I'+r),m=find(S.machines,str(U('G'+r))),who=str(U('L'+r)),no=str(U('N'+r));
    const t={id:uid(),text,done:st==='Erledigt',doneAt:st==='Erledigt'?Date.now():null,ts:Date.now(),prio:pr==='h'?'h':pr==='n'?'n':'m',due:typeof du==='number'?xlDay(du):'',machineId:m?m.id:'',note:[who?'Verantwortlich: '+who:'',no].filter(Boolean).join(' · ')};
    S.tasks.push(t);nt.push(t);res.tNew++;
  }
  await Store.putMany('tasks',nt);
  return res;
}
async function backupJson(full){
  const out={app:'fehlerbild',v:2,version:APP_VERSION,at:Date.now(),stores:{}};
  for(const s of STORES){
    if(s==='images'){if(full)out.stores.images=(await Store.all('images')).map(r=>({id:r.id,type:r.type,b64:bufToB64(r.buf)}))}

    else out.stores[s]=await Store.all(s);
  }
  return JSON.stringify(out);
}
async function restoreJson(txt){
  const d=JSON.parse(txt);if(!d||d.app!=='fehlerbild'||!d.stores)throw new Error('format');
  const pins=(await Store.all('kv')).filter(r=>/^pin/.test(r.id));

    for(let i=0;i<rows.length;i+=40)await Store.putMany(s,rows.slice(i,i+40));
  }
  await Store.putMany('kv',pins);
  await loadAll();applyTheme();
}

const hasCrypto=!!(window.crypto&&crypto.subtle);
const L={mode:null,entry:'',first:'',msg:'',cb:null,forgot:false,later:false};
const b64=u=>btoa(String.fromCharCode(...u));
async function pinHash(pin,salt){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000},key,256);
  return b64(new Uint8Array(bits));
}

async function pinCheck(){
  const p=S.kv.pin,ok=(await pinHash(L.entry,p.salt))===p.hash;
  if(ok){if(S.kv.pinFail)await setKv('pinFail',null);const cb=L.cb;lockClose();if(cb)cb();return}
  const n=((S.kv.pinFail&&S.kv.pinFail.n)||0)+1;
  await setKv('pinFail',{n,until:n>=5?Date.now()+30000:0});L.entry='';L.msg='Falsche PIN.';lockRender();
}
ACT.pin=async el=>{
  if(!L.mode||lockWait())return;
  const setup=L.mode==='setup1'||L.mode==='setup2',max=setup?8:S.kv.pin.len;
  if(L.entry.length>=max)return;
  L.entry+=el.dataset.id;L.msg='';lockRender();
  if(!setup&&L.entry.length===max)await pinCheck();
};
ACT.pindel=()=>{L.entry=L.entry.slice(0,-1);lockRender()};
ACT.pincancel=async()=>{if(L.mode==='unlock')return;if(L.later)await setKv('pinSkipped',true);lockClose()};
ACT.pinforgot=()=>{L.forgot=!L.forgot;lockRender()};
ACT.pinok=async()=>{
  if(L.mode==='setup1'){
    if(L.entry.length<4){L.msg='Mindestens 4 Ziffern.';lockRender();return}
    L.first=L.entry;L.entry='';L.msg='';L.mode='setup2';lockRender();
  }else if(L.mode==='setup2'){
    if(L.entry!==L.first){L.mode='setup1';L.entry='';L.first='';L.msg='Die beiden PINs waren verschieden. Bitte noch einmal.';lockRender();return}
    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
    await setKv('pin',{salt,hash:await pinHash(L.entry,salt),len:L.entry.length});await setKv('pinFail',null);
    lockClose();render();toast('PIN-Sperre ist aktiv.');
  }
};
async function wipeAll(){
  for(const s of STORES)await Store.clear(s);
  for(const k of Object.keys(S))S[k]=k==='kv'?{}:[];
  await seed();await setKv('pinSkipped',true);stack.length=0;V={name:'start'};
}
ACT.pinreset=async()=>{await wipeAll();applyTheme();lockClose();render();toast('Alles gelöscht. Die App ist wieder leer.')};
ACT.pinsetup=()=>lockOpen('setup1');
ACT.pinchange=()=>lockOpen('verify',()=>lockOpen('setup1'));
ACT.pinremove=()=>lockOpen('verify',async()=>{await setKv('pin',null);render();toast('PIN-Sperre entfernt.')});
ACT.locknow=()=>lockOpen('unlock');
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(S.kv.pin&&!L.mode&&hiddenAt&&Date.now()-hiddenAt>120000)lockOpen('unlock');
});
document.addEventListener('keydown',e=>{
  if(!L.mode||L.forgot||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();run(ACT.pin,{dataset:{id:e.key}})}
  else if(e.key==='Backspace'){e.preventDefault();ACT.pindel()}
  else if(e.key==='Enter'&&(L.mode==='setup1'||L.mode==='setup2')){e.preventDefault();run(ACT.pinok)}
});

/* ===== Ereignisse ===== */
let armedEl=null,armedT=null;
function disarm(){if(armedEl&&armedEl.isConnected){armedEl.textContent=armedEl.dataset.label;armedEl.classList.remove('armed')}armedEl=null;clearTimeout(armedT)}
function confirmTap(el){
  if(armedEl===el){disarm();return true}
  disarm();armedEl=el;el.dataset.label=el.textContent;el.textContent=el.dataset.confirm;el.classList.add('armed');
  armedT=setTimeout(disarm,3500);return false;
}
const run=(fn,a,b)=>{if(fn)Promise.resolve().then(()=>fn(a,b)).catch(e=>{console.error(e);toast('Das hat nicht geklappt.')})};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.confirm&&!confirmTap(el))return;
  run(ACT[el.dataset.act],el,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el)run(CHG[el.dataset.chg],el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el)run(INP[el.dataset.inp],el,e)});
document.addEventListener('submit',e=>{e.preventDefault();run(SUB[e.target.dataset.sub],e.target)});

function tick(){
  if(L.mode&&!L.forgot&&S.kv.pinFail&&S.kv.pinFail.until>Date.now()-1500)lockRender();
  if(V.name==='start'){
    if(currentShift()!==V.shown&&V.shown){render();return}
    const c=$('#clock'),a=$('#arc'),l=$('#shleft');
    if(c)c.textContent=clockHtml();if(a)a.setAttribute('stroke-dasharray',ringDash());if(l)l.textContent=shiftLeft();
  }else if(V.name==='stempeluhr'){
    const now=Date.now(),s=$('#since'),a=$('#wtoday'),b=$('#wweek');
    if(s)s.textContent=sinceHtml();
    if(a)a.textContent=fmtDur(workedMs(S.stamps,startOfDay(),now));
    if(b)b.textContent=fmtDur(workedMs(S.stamps,mondayStart(new Date()),now));
  }
}
async function init(){
  const st=document.createElement('style');st.textContent=REPORT_CSS;document.head.appendChild(st);
  await Store.open();
  await loadAll();
  if(!S.kv.seeded)await seed();
  applyTheme();
  render();
  if(hasCrypto&&S.kv.pin)lockOpen('unlock');
  else if(hasCrypto&&!S.kv.pinSkipped){lockOpen('setup1');L.later=true;lockRender()}
  setInterval(tick,1000);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('sw.js').catch(()=>{});setTimeout(()=>checkUpdate(false),6000)}}catch(e){}
}
init().catch(e=>{console.error(e);$('#app').innerHTML='<div class="top"><h1>Fehlerbild</h1></div><p>Die App konnte nicht starten. Bitte lade die Seite neu.</p>'});
</script>
